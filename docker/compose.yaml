name: asociacion-jukebox-multiservicio

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./src:/var/www/html
      - ./data:/var/www/data
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:?Copia .env.example a .env}
      PGUSER: ${PGUSER:?Copia .env.example a .env}
      PGPASSWORD: ${PGPASSWORD:?Copia .env.example a .env}
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Copia .env.example a .env}
      MARIADB_USER: ${MARIADB_USER:?Copia .env.example a .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Copia .env.example a .env}
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:?Copia .env.example a .env}
      POSTGRES_USER: ${PGUSER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Copia .env.example a .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Copia .env.example a .env}
      MARIADB_USER: ${MARIADB_USER:?Copia .env.example a .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Copia .env.example a .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copia .env.example a .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  mariadb-data:
